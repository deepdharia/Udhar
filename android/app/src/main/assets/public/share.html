<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shared ledger — Udhar</title>
<style>
  :root{--bg:#0B1020;--glass:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.12);
    --txt:#F1F5F9;--mut:#94A3B8;--green:#22C55E;--red:#EF4444;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1200px 800px at 80% -10%,#16213E 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:20px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;margin:26px 0 6px}
  header .coin{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(135deg,#101C33,#0B1020);border:1px solid var(--stroke);
    box-shadow:0 8px 30px rgba(34,197,94,.3)}
  header .coin svg{width:40px;height:40px;display:block}
  header .wordmark{font-size:38px;font-weight:800;letter-spacing:-2px;line-height:1;
    background:linear-gradient(115deg,#D1FAE5 0%,#4ADE80 45%,#22C55E 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  header .tag{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:2.6px;margin-top:8px}
  header p{color:var(--mut);font-size:13px;margin-top:10px}
  .badge{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:1.5px;color:var(--mut);
    border:1px solid var(--stroke);border-radius:99px;padding:5px 14px;background:var(--glass)}
  .total{margin:22px 0;text-align:center;background:var(--glass);border:1px solid var(--stroke);
    border-radius:20px;padding:20px;backdrop-filter:blur(14px)}
  .total small{color:var(--mut);letter-spacing:2px;font-size:11px}
  .total .amt{font-family:var(--mono);font-size:38px;font-weight:800;margin-top:6px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
    padding:16px;margin-bottom:14px;backdrop-filter:blur(14px)}
  .card .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .card .chead b{font-size:17px}
  .card .chead span{font-family:var(--mono);font-weight:700}
  .e{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-top:1px solid var(--stroke);font-size:14px}
  .e .meta{color:var(--mut);font-size:12px;margin-top:2px}
  .e .amt{font-family:var(--mono);font-weight:700;white-space:nowrap;margin-left:10px}
  .empty{text-align:center;color:var(--mut);margin:60px 20px;line-height:1.7}
  footer{text-align:center;color:var(--mut);font-size:12px;margin-top:34px;line-height:1.8}
  footer b{color:var(--txt)}
  .chead{gap:12px;flex-wrap:wrap}.chead b,.meta{overflow-wrap:anywhere}.total .amt{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="coin"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#22C55E"/><circle cx="24" cy="24" r="16.4" fill="#16A34A"/><g stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M15 17h18M15 23h18M24 17v17M24 26c4.5 0 7 2.4 8.5 7"/></g></svg></div>
    <div class="wordmark">udhar</div>
    <div class="tag">UDHAR KA HISAAB, SORTED.</div>
    <p id="sub">Read-only view</p><br>
    <span class="badge">READ-ONLY · SHARED VIA UDHAR</span>
  </header>
  <div id="out"></div>
  <footer id="foot" style="display:none">
    This is a <b>read-only</b> snapshot — it can't be edited here.<br>
    Anyone with this complete link can read and forward it. It has no expiry or revocation.<br><br>
    Made with <b>Udhar</b> — the dead-simple lending tracker.
  </footer>
</div>
<script src="ledger-core.js"></script>
<script>
"use strict";
function decShare(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}) +
    ", " + d.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
(function(){
  const out = document.getElementById("out");
  let data, ledger;
  try {
    const m = location.hash.match(/^#d=([A-Za-z0-9\-_]{1,8000})$/);
    if (!m) throw new Error("Missing ledger");
    data = decShare(m[1]); ledger = UdharLedger.shared(data);
  } catch(_) {
    out.innerHTML = '<div class="empty">🔗<br>This link is incomplete or contains an invalid ledger.<br>Ask the sender for a fresh share link.</div>';
    return;
  }
  const money = n => esc(ledger.settings.currency) + n.toLocaleString("en-IN", {maximumFractionDigits: 2});
  const total = UdharLedger.totals(ledger);
  document.getElementById("sub").textContent = "Shared " + fmtDate(data.at) + " · Balances are from the sender’s perspective";
  let html = '<div class="total"><small>SENDER TO RECEIVE</small><div class="amt pos">' + money(total.recv) +
    '</div><small>SENDER TO PAY</small><div class="amt neg">' + money(total.pay) + '</div></div>';
  for (const p of ledger.people){
    const b = UdharLedger.balance(ledger, p.id);
    html += '<div class="card"><div class="chead"><b>' + esc(p.name) + '</b><span class="' +
      (b >= 0 ? "pos" : "neg") + '">' + money(Math.abs(b)) +
      (b > 0 ? " to receive" : b < 0 ? " to pay" : " settled") + "</span></div>";
    const es = ledger.entries.filter(e => e.personId === p.id).sort((a,b) => b.ts - a.ts);
    for (const e of es){
      const gave = e.type === "gave";
      html += '<div class="e"><div><div>' + (gave ? "📤 Given" : "📥 Received back") + '</div><div class="meta">' +
        fmtDate(e.ts) + (e.reason ? " · " + esc(e.reason) : "") + '</div></div><div class="amt ' +
        (gave ? "pos" : "neg") + '">' + (gave ? "+" : "−") + money(e.amount) + "</div></div>";
    }
    html += "</div>";
  }
  out.innerHTML = html;
  document.getElementById("foot").style.display = "block";
})();
</script>
</body>
</html>
